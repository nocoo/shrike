name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: clippy

      - name: Setup JS and frozen dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
        with:
          runtime-version: "1.4.2"
          install-policy: "blocked"

      - name: Build
        run: bun run build

      - name: Lint (ESLint + Cargo Clippy)
        run: bun run lint

      - name: Test (TypeScript)
        run: bun run test:coverage

      - name: Test (Rust)
        run: bun run test:rs

      - name: Test (Rust E2E - L2)
        run: bun run test:e2e:rs

  security:
    uses: nocoo/base-ci/.github/workflows/security.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      lockfiles: "bun.lock,Cargo.lock"
      osv-config: "osv-scanner.toml"
      gitleaks-config: ".gitleaks.toml"
